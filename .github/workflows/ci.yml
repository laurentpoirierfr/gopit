# Intégration continue : formatage, go vet et tests à chaque push et pull
# request, plus une validation à blanc de GoReleaser.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Les tests de l'éditeur et du client LSP dialoguent avec le vrai gopls
      # (ils sont sautés sans lui) : version fixée, pour des résultats stables.
      - name: Installer gopls
        run: |
          go install golang.org/x/tools/gopls@v0.24.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vérifier gopls
        run: gopls version

      - name: Formatage, vet et tests
        run: make check

      - name: Tests avec le détecteur de concurrence
        run: go test -race ./...

      - name: Compilation
        run: make build && ./bin/gopit --version

  goreleaser:
    name: GoReleaser (validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Vérification de la configuration et build snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
